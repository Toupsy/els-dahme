services:
  app:
    build: .
    image: els-dahme:local
    env_file: .env
    restart: unless-stopped
    volumes:
      - app_data:/data
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN fehlt in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  app_data:
  caddy_data:
  caddy_config:
